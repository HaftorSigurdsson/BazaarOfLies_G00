name: Game Master

on:
  workflow_dispatch:
  push:
    paths:
      - 'gameplay/votes/**'
      - 'gameplay/night/**'
      - 'gameplay/village/**'      # ← NEW: statements tick the clock too
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:                    # ← NEW: the race seatbelt
  group: gm
  cancel-in-progress: true

jobs:
  gm:
    runs-on: ubuntu-latest
    timeout-minutes: 10         # ← NEW: hung run can't block the clock forever
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pynacl==1.6.2

      - name: Configure git identity
        run: |
          git config user.name "Game Master"
          git config user.email "gm@bazaar.local"

      - name: Run Game Master
        env:
          GM_PRIVATE_KEY: ${{ secrets.GM_PRIVATE_KEY }}
        run: python gm/run.py
