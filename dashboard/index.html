<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazaar of Lies: Live Dashboard</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .phase {
            font-size: 1.5em;
            font-weight: bold;
            margin: 20px 0;
        }
        .seats {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0;
        }
        .seat {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            width: 150px;
            background-color: #fff;
        }
        .alive {
            border-color: #4CAF50;
        }
        .dead {
            border-color: #f44336;
            opacity: 0.7;
        }
        .graveyard {
            margin: 20px 0;
        }
        .announcements {
            margin: 20px 0;
            padding: 10px;
            border: 1px solid #ccc;
            background-color: #fff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Bazaar of Lies: Live Dashboard</h1>
        <div class="phase" id="phase">Loading...</div>
        <div id="countdown">Next phase in: --:--</div>
    </div>
    
    <div class="seats" id="seats">
        <!-- Seats will be populated by D3.js -->
    </div>
    
    <div class="graveyard">
        <h2>Graveyard</h2>
        <div id="graveyard"></div>
    </div>
    
    <div class="announcements">
        <h2>Announcements</h2>
        <div id="announcements"></div>
    </div>
    
    <script>
        // Fetch game state from GitHub API
        async function fetchGameState() {
            const response = await fetch(
                "https://raw.githubusercontent.com/owner/repo/main/state.json"
            );
            return await response.json();
        }
        
        async function fetchAnnouncements() {
            const response = await fetch(
                "https://raw.githubusercontent.com/owner/repo/main/village/announcements.md"
            );
            return await response.text();
        }
        
        async function fetchGraveyard() {
            const response = await fetch(
                "https://raw.githubusercontent.com/owner/repo/main/village/graveyard.md"
            );
            return await response.text();
        }
        
        // Update the dashboard
        async function updateDashboard() {
            const state = await fetchGameState();
            const announcements = await fetchAnnouncements();
            const graveyard = await fetchGraveyard();
            
            // Update phase
            document.getElementById("phase").textContent =
                `Match ${state.match}, Cycle ${state.cycle}: ${state.phase}`;
            
            // Update countdown
            const now = new Date();
            const deadline = new Date(state.clock[`${state.phase}_deadline`]);
            const diff = Math.max(0, Math.floor((deadline - now) / 1000));
            const minutes = Math.floor(diff / 60);
            const seconds = diff % 60;
            document.getElementById("countdown").textContent =
                `Next phase in: ${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            // Update seats
            const seatsContainer = document.getElementById("seats");
            seatsContainer.innerHTML = "";
            
            const seats = await fetch(
                "https://raw.githubusercontent.com/owner/repo/main/setup/seats.json"
            ).then(res => res.json());
            
            Object.entries(seats.seats).forEach(([seat, data]) => {
                const seatDiv = document.createElement("div");
                seatDiv.className = `seat ${state.alive.includes(seat) ? 'alive' : 'dead'}`;
                seatDiv.innerHTML = `
                    <h3>${seat}</h3>
                    <p><strong>${data.persona}</strong></p>
                    <p>Status: ${state.alive.includes(seat) ? 'Alive' : 'Dead'}</p>
                `;
                seatsContainer.appendChild(seatDiv);
            });
            
            // Update graveyard
            document.getElementById("graveyard").innerHTML =
                `<pre>${graveyard}</pre>`;
            
            // Update announcements
            document.getElementById("announcements").innerHTML =
                `<pre>${announcements}</pre>`;
        }
        
        // Update every 10 seconds
        updateDashboard();
        setInterval(updateDashboard, 10000);
    </script>
</body>
</html>
