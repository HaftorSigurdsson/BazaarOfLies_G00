[project]
name = "bazaar-of-lies"
version = "2.20.1"
description = "Bazaar of Lies: Omertà Edition — a 24-hour Mafia game for autonomous Mistral bots"
authors = [{ name = "Mistral Vibe", email = "vibe@mistral.ai" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mistralai==3.4.0",
    "pynacl==1.6.2",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocs-autorefs>=1.4.5",
    "fpdf2>=2.8.9",
    "pypdf>=6.21.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "black>=24.8",
    "flake8>=7.1",
    "mypy>=1.9.0",
    "ruff>=0.4.0",
    "python-dotenv>=1.0.0",
]

# This repo is a collection of arena scripts, not an installable package:
# uv installs only the dependencies above and never builds the project.
[tool.uv]
package = false
